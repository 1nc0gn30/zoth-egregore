[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoth-egregore"
version = "0.1.0b1"
description = "[BETA] EGREGORE — Experimental collective-intelligence proxy: one OpenAI-compatible model face backed by up to 1,000 parallel co-prime Pantheon lenses, Beta-posterior Adaptive-Consistency stopping, header-driven RPM/TPM rate limiting, and single-flight SQLite caching."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "1nc0gn30", email = "ops@nullai.tech"}]
dependencies = []

[project.scripts]
zoth-egregore = "egregore.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
